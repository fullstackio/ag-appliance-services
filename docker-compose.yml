# AG Appliance Service — Docker Compose
#
#   Production-like:  docker compose up --build web
#   Development:      docker compose --profile dev up --build web-dev
#   Only MongoDB:     docker compose up -d mongo   (then `npm run dev` locally)
#
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ag-appliance-service:latest
    container_name: ag-appliance-web
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      LOG_DIR: /app/logs
      MONGODB_URI: mongodb://root:example@mongo:27017
      MONGODB_DB: ag_appliance
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  web-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ag-appliance-service:dev
    container_name: ag-appliance-web-dev
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      LOG_DIR: /app/logs
      MONGODB_URI: mongodb://root:example@mongo:27017
      MONGODB_DB: ag_appliance
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- -H 0.0.0.0

  mongo:
    image: mongo:7
    container_name: ag-appliance-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: ag_appliance
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
