<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" fill="none" stroke="#F0DFC0" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- Victoria Memorial -->
  <g transform="translate(20,20)">
    <!-- steps / base -->
    <rect x="0" y="280" width="520" height="15" />
    <rect x="20" y="250" width="480" height="30" />
    <!-- colonnade -->
    <line x1="50" y1="210" x2="50" y2="250" />
    <line x1="96" y1="210" x2="96" y2="250" />
    <line x1="142" y1="210" x2="142" y2="250" />
    <line x1="188" y1="210" x2="188" y2="250" />
    <line x1="332" y1="210" x2="332" y2="250" />
    <line x1="378" y1="210" x2="378" y2="250" />
    <line x1="424" y1="210" x2="424" y2="250" />
    <line x1="470" y1="210" x2="470" y2="250" />
    <path d="M50 210 Q73 192 96 210" />
    <path d="M96 210 Q119 192 142 210" />
    <path d="M142 210 Q165 192 188 210" />
    <path d="M332 210 Q355 192 378 210" />
    <path d="M378 210 Q401 192 424 210" />
    <path d="M424 210 Q447 192 470 210" />
    <rect x="40" y="195" width="440" height="15" />
    <!-- corner cupolas -->
    <rect x="64" y="140" width="12" height="55" />
    <circle cx="70" cy="140" r="16" />
    <path d="M54 140 Q70 112 86 140" />
    <line x1="70" y1="112" x2="70" y2="96" />
    <circle cx="70" cy="92" r="4" />
    <rect x="444" y="140" width="12" height="55" />
    <circle cx="450" cy="140" r="16" />
    <path d="M434 140 Q450 112 466 140" />
    <line x1="450" y1="112" x2="450" y2="96" />
    <circle cx="450" cy="92" r="4" />
    <!-- central dome -->
    <rect x="230" y="150" width="140" height="45" />
    <path d="M230 150 Q300 34 370 150" />
    <line x1="300" y1="34" x2="300" y2="10" />
    <circle cx="300" cy="7" r="5" />
    <!-- clock tower -->
    <line x1="24" y1="90" x2="24" y2="65" />
    <circle cx="24" cy="94" r="3.5" />
    <rect x="40" y="60" width="26" height="190" />
    <path d="M40 60 L53 8 L66 60 Z" />
    <circle cx="53" cy="112" r="9" />
    <line x1="53" y1="105" x2="53" y2="112" />
    <line x1="53" y1="112" x2="58" y2="115" />
    <line x1="76" y1="90" x2="76" y2="65" />
    <circle cx="76" cy="94" r="3.5" />
  </g>

  <!-- Howrah Bridge -->
  <g transform="translate(600,20)">
    <!-- approach ramps -->
    <line x1="-60" y1="320" x2="20" y2="280" />
    <line x1="600" y1="320" x2="580" y2="280" />
    <!-- deck -->
    <line x1="-60" y1="280" x2="620" y2="280" />
    <!-- towers -->
    <path d="M20 280 L90 280 L70 40 L40 40 Z" />
    <path d="M510 280 L580 280 L560 40 L530 40 Z" />
    <!-- top chord (cantilever dip) -->
    <path d="M55 40 L132 55 L174 72 L216 90 L258 102 L300 108 L342 102 L384 90 L426 72 L468 55 L545 40" />
    <!-- verticals -->
    <line x1="90" y1="55" x2="90" y2="280" />
    <line x1="132" y1="55" x2="132" y2="280" />
    <line x1="174" y1="72" x2="174" y2="280" />
    <line x1="216" y1="90" x2="216" y2="280" />
    <line x1="258" y1="102" x2="258" y2="280" />
    <line x1="300" y1="108" x2="300" y2="280" />
    <line x1="342" y1="102" x2="342" y2="280" />
    <line x1="384" y1="90" x2="384" y2="280" />
    <line x1="426" y1="72" x2="426" y2="280" />
    <line x1="468" y1="55" x2="468" y2="280" />
    <line x1="510" y1="40" x2="510" y2="280" />
    <!-- diagonal lattice (X-bracing) -->
    <line x1="90" y1="55" x2="132" y2="280" />
    <line x1="132" y1="280" x2="174" y2="72" />
    <line x1="174" y1="72" x2="216" y2="280" />
    <line x1="216" y1="280" x2="258" y2="102" />
    <line x1="258" y1="102" x2="300" y2="280" />
    <line x1="300" y1="280" x2="342" y2="102" />
    <line x1="342" y1="102" x2="384" y2="280" />
    <line x1="384" y1="280" x2="426" y2="72" />
    <line x1="426" y1="72" x2="468" y2="280" />
    <line x1="468" y1="280" x2="510" y2="40" />
  </g>

  <!-- water / reflection -->
  <path d="M0 305 Q60 298 120 305 T240 305 T360 305 T480 305 T600 305 T720 305 T840 305 T960 305 T1080 305 T1200 305" opacity="0.55" />
  <path d="M0 322 Q80 317 160 322 T320 322 T480 322 T640 322 T800 322 T960 322 T1120 322 T1200 322" opacity="0.3" />
</svg>
